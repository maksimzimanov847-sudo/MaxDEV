     <!-- Калькулятор -->
<section class="fade-in schedule">
    <div class="container col-md-4">
        <h1 class="text-center">Калькулятор стоимости </h1>
        <div class="form-group">
            <label for="people">Количество людей:</label>
            <input type="number" class="form-control" id="people" placeholder="Введите количество людей">
        </div>
        <div class="form-group">
            <label for="days">Количество дней:</label>
            <input type="number" class="form-control" id="days" placeholder="Введите количество дней">
        </div>
        <div class="d-grid gap-2">
        <button class="btn btn-primary " onclick="calculate()">Рассчитать</button>
        <h2 class="mt-4" id="result"></h2>
    </div>
</div>
</section>
    <script>
        function calculate() {
            const st = parseFloat("1000.5");
            const people = document.getElementById('people').value;
            const days = document.getElementById('days').value;
            const result = people * days * st;
            document.getElementById('result').innerText = `:стоимость руб ${result}`;
        }
    </script>
